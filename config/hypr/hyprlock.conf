# Catppuccin Mocha

background {
    monitor =
    path = $HOME/Pictures/Wallpapers/abstract-swirls.jpg
    blur_passes = 3
    blur_size = 10
    brightness = 0.55
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = $USER
    color = rgba(180, 190, 254, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 240
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 112
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(17, 17, 27, 0.55)
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(166, 173, 200, 1.0)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(203, 166, 247, 1.0)
    inner_color = rgba(49, 50, 68, 0.85)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">Enter password…</span>
    hide_input = false
    position = 0, -110
    halign = center
    valign = center
    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(249, 226, 175, 1.0)
}
